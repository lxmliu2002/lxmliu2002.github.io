---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('lxmliu-theme');
          var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = storedTheme || systemTheme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      }());
    </script>
    {% include head.html %}
    <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
    {% include head/custom.html %}
  </head>

  <body class="home-page">
    {% include browser-upgrade.html %}
    {% include home-masthead.html %}

    <main id="main" class="home-main" role="main">
      <section class="home-hero" aria-label="Profile">
        <div class="home-hero__profile">
          {% include author-profile.html %}
        </div>
      </section>

      <article class="home-article" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="home-content" itemprop="text">
          {{ content }}
        </div>
      </article>
    </main>

    {% include scripts.html %}
    <script src="{{ '/assets/js/home.js' | relative_url }}"></script>
  </body>
</html>
