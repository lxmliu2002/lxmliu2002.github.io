---
layout: compress
---

<!doctype html>
<html lang="en" data-language="en" class="no-js">
  <head>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('lxmliu-theme');
          var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = storedTheme || systemTheme;
          var storedLanguage = localStorage.getItem('lxmliu-language');
          if (storedLanguage === 'zh') {
            document.documentElement.dataset.language = 'zh';
            document.documentElement.lang = 'zh-CN';
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      }());
    </script>
    {% include head.html %}
    <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
    {% include head/custom.html %}
  </head>

  <body class="home-page">
    {% include browser-upgrade.html %}
    {% include home-masthead.html %}

    <main class="home" id="main-content">
      {{ content }}
    </main>

    {% include scripts.html %}
    <script src="{{ '/assets/js/home.js' | relative_url }}"></script>
  </body>
</html>
