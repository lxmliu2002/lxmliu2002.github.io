<header class="home-header" data-home-header>
  {% assign navigation_links = site.data.navigation.main %}
  <div class="home-header__inner">
    <a class="home-brand" href="{{ '/#home' | relative_url }}">Xiuming Liu<span aria-hidden="true"></span></a>

    <nav class="home-nav" aria-label="Primary navigation" data-home-navigation>
      <div class="home-nav__links" id="home-nav-menu" data-home-nav-menu>
        {% for link in navigation_links %}
          {% assign zh_link = site.data.navigation.main_zh[forloop.index0] %}
          <a class="home-nav__link" href="{{ link.url | relative_url }}" data-home-nav-link data-label-en="{{ link.title }}" data-label-zh="{{ zh_link.title }}">{{ link.title }}</a>
        {% endfor %}
      </div>

      <div class="home-nav__actions">
        <button class="home-theme-button" type="button" data-theme-toggle aria-pressed="false" title="Toggle color theme">
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true"><i class="fas fa-sun"></i></span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true"><i class="fas fa-moon"></i></span>
          <span class="visually-hidden">Toggle color theme</span>
        </button>
        <button class="home-language-button" type="button" data-language-toggle title="切换到中文" aria-label="切换到中文">
          <i class="fas fa-language" aria-hidden="true"></i><span>中</span>
        </button>
        <button class="home-menu-button" type="button" data-home-menu-toggle aria-expanded="false" aria-controls="home-nav-menu" title="Open navigation">
          <i class="fas fa-bars" aria-hidden="true"></i>
          <span class="visually-hidden">Open navigation</span>
        </button>
      </div>
    </nav>
  </div>
</header>
